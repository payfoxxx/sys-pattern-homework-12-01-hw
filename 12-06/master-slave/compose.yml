services:
  postgres-master:
    build: ./master
    container_name: postgres-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5434:5432"
    volumes:
      - master_data:/var/lib/postgresql/data
    networks:
      - pg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-slave:
    build: ./slave
    container_name: postgres-slave
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      MASTER_HOST: postgres-master
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicatorpass
    ports:
      - "5433:5432"
    depends_on:
      postgres-master:
        condition: service_healthy
    volumes:
      - slave_data:/var/lib/postgresql/data
    networks:
      - pg_net

volumes:
  master_data:
  slave_data:

networks:
  pg_net:
    driver: bridge