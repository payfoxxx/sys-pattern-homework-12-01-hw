services:
  # Горизонтальные шарды для Users
  users_1:
    image: postgres:17
    container_name: users_1
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5437:5432"
    volumes:
      - ./users1/shards.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network

  users_2:
    image: postgres:17
    container_name: users_2
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5436:5432"
    volumes:
      - ./users2/shards.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network

  # Вертикальные шарды для Books
  books_catalog:
    image: postgres:17
    container_name: books_catalog
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - ./books_catalog/shards.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network

  books_description:
    image: postgres:17
    container_name: books_description
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - ./books_description/shards.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network


  pg_main:
    image: postgres:17
    container_name: pg_main
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    depends_on:
      - users_1
      - users_2
      - books_catalog
      - books_description
    volumes:
      - ./pg_main/shards.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge